<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Char Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="wcc-header">
      <img class="wcc-logo" src="../../icons/icon-32.png" alt="" />
      <h1>Companion</h1>
    </header>

    <main>
      <label class="row">
        <span>Enabled</span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row">
        <span>Character</span>
        <select id="character"></select>
      </label>

      <label class="row sub">
        <span>This tab only</span>
        <input type="checkbox" id="perTab" />
      </label>

      <label class="row">
        <span>Activity</span>
        <select id="activity">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <fieldset class="group">
        <legend>Page reactions</legend>
        <label class="check"
          ><input type="checkbox" id="readHeadings" /> Read headings</label
        >
        <label class="check"
          ><input type="checkbox" id="lookAtImages" /> Look at images</label
        >
        <label class="check"
          ><input type="checkbox" id="sitOnElements" /> Sit on elements</label
        >
        <label class="check"><input type="checkbox" id="sleep" /> Sleep</label>
        <label class="check"
          ><input type="checkbox" id="reactToInput" /> Take notes while
          typing</label
        >
        <label class="check"
          ><input type="checkbox" id="watchFilm" /> Watch playing videos</label
        >
        <label class="check"
          ><input type="checkbox" id="reactToDrag" /> React when dragged</label
        >
        <label class="check"
          ><input type="checkbox" id="reactToSensitive" /> Tiptoe past password
          fields</label
        >
      </fieldset>

      <label class="row">
        <span>Reduce motion</span>
        <input type="checkbox" id="reduceMotion" />
      </label>

      <fieldset class="group alarm">
        <legend>Alarm</legend>
        <label class="check master">
          <input type="checkbox" id="alarmEnabled" /> Enable alarms
        </label>

        <div id="alarmList" class="alarm-list"></div>
        <button id="alarmAdd" class="btn small">+ Add time</button>

        <div class="alarm-sound">
          <label class="check">
            <input type="checkbox" id="alarmSoundOn" /> Sound
            <button id="alarmPreview" class="icon-btn" type="button" title="Preview sound">&#9654;</button>
          </label>
          <label class="volume">
            <span>Volume</span>
            <input type="range" id="alarmVolume" min="0" max="100" step="5" />
          </label>
          <div class="alarm-sound-name" id="alarmSoundName">Default</div>
          <button id="alarmSoundManage" class="link">Change sound…</button>
        </div>
        <p class="hint" id="alarmHint"></p>
        <button id="alarmNotifyWarn" class="notify-warn" hidden>
          Alarms can't notify you while the browser is in the background.
          Click to allow notifications.
        </button>
      </fieldset>

      <div class="site">
        <div class="site-host" id="site-host">—</div>
        <select id="site-rule">
          <option value="default">Default (auto)</option>
          <option value="on">Always on here</option>
          <option value="off">Disable here</option>
        </select>
      </div>

      <fieldset class="group">
        <legend>Auto-disable (keywords)</legend>
        <p class="hint">
          The companion hides when the URL contains any of these words. One per
          line. Leave empty for no restriction.
        </p>
        <textarea id="sensitiveHints" rows="4" spellcheck="false"></textarea>
      </fieldset>

      <div class="runstate">
        <span class="dot" id="state-dot"></span>
        <span id="state-text">Checking…</span>
      </div>
      <button id="toggle" class="btn primary" disabled>…</button>

      <button id="manage" class="link">Manage characters…</button>
    </main>

    <script src="../shared/builtin-characters.js"></script>
    <script src="../shared/alarm-schedule.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
