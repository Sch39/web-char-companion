<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Chibi Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="wcc-header">
      <img class="wcc-logo" src="../../icons/icon-32.png" alt="" />
      <h1>Companion</h1>
    </header>

    <main>
      <label class="row">
        <span>Enabled</span>
        <input type="checkbox" id="enabled" />
      </label>

      <label class="row">
        <span>Character</span>
        <select id="character"></select>
      </label>

      <label class="row sub">
        <span>This tab only</span>
        <input type="checkbox" id="perTab" />
      </label>

      <label class="row">
        <span>Activity</span>
        <select id="activity">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </label>

      <fieldset class="group">
        <legend>Page reactions</legend>
        <label class="check"><input type="checkbox" id="readHeadings" /> Read headings</label>
        <label class="check"><input type="checkbox" id="lookAtImages" /> Look at images</label>
        <label class="check"><input type="checkbox" id="sitOnElements" /> Sit on elements</label>
        <label class="check"><input type="checkbox" id="sleep" /> Sleep</label>
        <label class="check"><input type="checkbox" id="reactToInput" /> Take notes while typing</label>
        <label class="check"><input type="checkbox" id="watchFilm" /> Watch playing videos</label>
        <label class="check"><input type="checkbox" id="reactToDrag" /> React when dragged</label>
      </fieldset>

      <label class="row">
        <span>Reduce motion</span>
        <input type="checkbox" id="reduceMotion" />
      </label>

      <div class="site">
        <div class="site-host" id="site-host">—</div>
        <select id="site-rule">
          <option value="default">Default (auto)</option>
          <option value="on">Always on here</option>
          <option value="off">Disable here</option>
        </select>
      </div>

      <fieldset class="group">
        <legend>Auto-disable (keywords)</legend>
        <p class="hint">The companion hides when the URL contains any of these
          words. One per line. Leave empty for no restriction.</p>
        <textarea id="sensitiveHints" rows="4" spellcheck="false"></textarea>
      </fieldset>

      <div class="runstate">
        <span class="dot" id="state-dot"></span>
        <span id="state-text">Checking…</span>
      </div>
      <button id="toggle" class="btn primary" disabled>…</button>

      <button id="manage" class="link">Manage characters…</button>
    </main>

    <script src="../shared/builtin-characters.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
